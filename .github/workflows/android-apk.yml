# Builds the VERIQ Scanner Android APK on GitHub's servers (no local Flutter/Android SDK needed).
# Trigger: push to the "apk-build" branch, or run manually from the Actions tab.
# The "main" branch is not used, so the Render deployment is not affected.
name: Build Android APK

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project files (same steps as tool/setup.ps1)
        run: |
          flutter create --org com.veriq --project-name veriq_scanner --platforms android --no-pub .
          G=android/app/build.gradle.kts; [ -f "$G" ] || G=android/app/build.gradle
          sed -i 's/com\.veriq\.veriq_scanner/com.veriq.scanner/g' "$G"
          sed -i -E 's/minSdk(Version)?[[:space:]]*=?[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$G"
          rm -rf android/app/src/main/kotlin/com/veriq/veriq_scanner android/app/src/main/java/com/veriq/veriq_scanner
          echo "--- $G"; grep -nE 'applicationId|namespace|minSdk' "$G"

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: veriq-scanner-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
